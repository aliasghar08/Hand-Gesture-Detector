workflows:
  android-workflow:
    name: Android Release Workflow
    max_build_duration: 30
    environment:
      flutter: default
    scripts:
      - name: Get Flutter packages
        script: |
          cd gesture_detector
          flutter packages pub get
      - name: Build APK with Flutter
        script: |
          cd gesture_detector
          flutter build apk --release
    artifacts:
      - gesture_detector/build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - aliasgharinnocent@yahoo.com

  ios-workflow:
    name: iOS Unsigned Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          cd gesture_detector
          flutter packages pub get
      - name: Build unsigned iOS IPA
        script: |
          set -e
          cd gesture_detector
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r app.ipa Payload
    artifacts:
      - gesture_detector/build/ios/iphoneos/app.ipa
    publishing:
      email:
        recipients:
          - aliasgharinnocent@yahoo.com
