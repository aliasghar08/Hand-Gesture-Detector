workflows:
  android-workflow:
    name: Android Release Workflow
    max_build_duration: 30
    environment:
      flutter: default
    scripts:
      - name: Get Flutter packages
        script: |
          cd gesture_detector
          flutter packages pub get
      - name: Build APK with Flutter
        script: |
          cd gesture_detector
          flutter build apk --release
    artifacts:
      - gesture_detector/build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - aliasgharinnocent@yahoo.com

  ios-workflow:
    name: iOS Unsigned Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          cd gesture_detector
          flutter packages pub get
      - name: Regenerate and Patch Podfile
        script: |
          set -e
          cd gesture_detector
          rm -f ios/Podfile
          flutter create . --platforms=ios
          
          ruby -e '
            path = "ios/Podfile"
            content = File.read(path)
            injection = <<-RUBY
                  target.build_configurations.each do |config|
                    config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "15.5"
                    config.build_settings["GCC_PREPROCESSOR_DEFINITIONS"] ||= [
                      "$(inherited)",
                      "PERMISSION_CAMERA=1",
                      "PERMISSION_MICROPHONE=1",
                      "PERMISSION_PHOTOS=1"
                    ]
                  end
            RUBY
            content = content.sub(/flutter_additional_ios_build_settings\(target\)/, "flutter_additional_ios_build_settings(target)\n" + injection)
            File.write(path, content)
          '
      - name: Build unsigned iOS IPA
        script: |
          set -e
          cd gesture_detector
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r app.ipa Payload
    artifacts:
      - gesture_detector/build/ios/iphoneos/app.ipa
    publishing:
      email:
        recipients:
          - aliasgharinnocent@yahoo.com
